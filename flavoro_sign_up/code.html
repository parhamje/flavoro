<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:wght@100..900&family=Plus+Jakarta+Sans:wght@100..900&display=swap" rel="stylesheet"/></head><body class="bg-background font-body-md text-on-surface"><main class="min-h-screen flex items-center justify-center p-gutter"><div class="flex flex-col w-full min-h-screen relative overflow-hidden bg-background">
<div class="absolute inset-0 z-0 opacity-20 pointer-events-none" data-alt="A macro, out-of-focus background shot of fresh culinary ingredients like herbs, peppercorns, and olive oil glistening on a dark wooden table. Deep forest green shadows with warm, amber lighting accents. Soft, moody, and sophisticated food photography style." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuB0Fd4sn8RUw4UICH5gQI8BNWsG7uEkcLSWf1rND2eVeNV5ADuXGv_ZcMeGQsea1pYxRRxvvb-tguj89y7FLlESMnKdPeHCs3y0VQLk-gAcckeEtAMWK5BWZpuHdauEWgllLcpChyeKmLk4tSMxNS0afkS_cZyBOnYG46nvuODCNkOjJmRbSOZJN-OHyCOIjSE0elCS6zcpy9c5f7THXRlzcn-ca1dJ3kpQsspDxXFg8FcTJyRBsELk-Q')"></div>
<div class="relative z-10 flex flex-col items-center justify-center flex-grow py-section-gap px-gutter w-full">
<div class="max-w-[480px] w-full flex flex-col items-center mb-12">
<span class="font-headline-md text-headline-md text-on-background mb-4">Flavoro</span>
<h1 class="font-display-lg text-display-lg text-on-background text-center tracking-tight">Join the table.</h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center mt-4 max-w-md">Begin your journey into a world of curated culinary experiences and exclusive epicurean events.</p>
</div>
<div class="w-full max-w-[480px] bg-surface rounded-xl shadow-xl p-8 md:p-10 relative overflow-hidden">
<div class="absolute top-0 right-0 -mr-16 -mt-16 w-32 h-32 rounded-full bg-secondary-fixed opacity-50 blur-2xl"></div>
<form class="flex flex-col space-y-6 relative z-10" id="signupForm" novalidate="">
<div class="flex flex-col space-y-2">
<label class="font-label-caps text-label-caps text-on-surface uppercase tracking-wider" for="fullName">Full Name</label>
<input class="w-full bg-surface-container-low text-on-surface font-body-md text-body-md px-4 py-3 rounded-DEFAULT outline-none transition-colors duration-200 focus:bg-surface focus:ring-1 focus:ring-secondary placeholder:text-outline-variant" id="fullName" placeholder="Jane Doe" required="" type="text"/>
</div>
<div class="flex flex-col space-y-2">
<label class="font-label-caps text-label-caps text-on-surface uppercase tracking-wider" for="email">Email Address</label>
<input class="w-full bg-surface-container-low text-on-surface font-body-md text-body-md px-4 py-3 rounded-DEFAULT outline-none transition-colors duration-200 focus:bg-surface focus:ring-1 focus:ring-secondary placeholder:text-outline-variant" id="email" placeholder="jane@example.com" required="" type="email"/>
</div>
<div class="flex flex-col space-y-2">
<label class="font-label-caps text-label-caps text-on-surface uppercase tracking-wider" for="phone">Phone Number <span class="text-on-surface-variant font-normal normal-case tracking-normal">(Optional)</span></label>
<input class="w-full bg-surface-container-low text-on-surface font-body-md text-body-md px-4 py-3 rounded-DEFAULT outline-none transition-colors duration-200 focus:bg-surface focus:ring-1 focus:ring-secondary placeholder:text-outline-variant" id="phone" placeholder="+1 (555) 000-0000" type="tel"/>
</div>
<div class="flex flex-col space-y-2">
<label class="font-label-caps text-label-caps text-on-surface uppercase tracking-wider" for="password">Password</label>
<div class="relative">
<input class="w-full bg-surface-container-low text-on-surface font-body-md text-body-md px-4 py-3 rounded-DEFAULT outline-none transition-colors duration-200 focus:bg-surface focus:ring-1 focus:ring-secondary placeholder:text-outline-variant pr-12" id="password" minlength="8" placeholder="••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors focus:outline-none" id="togglePassword" type="button">
<span class="material-symbols-outlined text-[20px]" id="visibilityIcon">visibility_off</span>
</button>
</div>
</div>
<div class="flex items-start space-x-3 mt-4">
<div class="flex items-center h-6">
<input class="w-5 h-5 rounded-sm bg-surface-container-low text-secondary focus:ring-secondary outline-none cursor-pointer border-none appearance-none checked:bg-secondary checked:after:content-['✓'] checked:after:text-on-secondary checked:after:flex checked:after:items-center checked:after:justify-center transition-all" id="mailingList" type="checkbox"/>
</div>
<label class="font-body-md text-body-md text-on-surface-variant cursor-pointer pt-0.5" for="mailingList">
                    Join our mailing list for exclusive invites, seasonal menus, and epicurean insights.
                </label>
</div>
<button class="w-full bg-primary text-on-primary font-title-lg text-title-lg py-4 rounded-full mt-8 hover:bg-on-primary-fixed-variant transition-colors duration-300 flex items-center justify-center group shadow-md hover:shadow-lg" type="submit">
<span>Create Account</span>
<span class="material-symbols-outlined ml-2 transform group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</form>
</div>
<div class="mt-8 text-center flex flex-col items-center">
<p class="font-body-md text-body-md text-on-surface-variant mb-2">Already a member of our community?</p>
<a class="font-title-lg text-title-lg text-secondary hover:text-on-secondary-fixed-variant transition-colors inline-flex items-center relative after:absolute after:bottom-0 after:left-0 after:w-full after:h-px after:bg-current after:origin-bottom-right after:scale-x-0 hover:after:origin-bottom-left hover:after:scale-x-100 after:transition-transform after:duration-300" href="#">
            Sign In here
        </a>
</div>
</div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const visibilityIcon = document.getElementById('visibilityIcon');
        const form = document.getElementById('signupForm');

        togglePassword.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            visibilityIcon.textContent = type === 'password' ? 'visibility_off' : 'visibility';
        });

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            // Basic validation check before simulation
            if (form.checkValidity()) {
                 const submitBtn = form.querySelector('button[type="submit"]');
                 const originalContent = submitBtn.innerHTML;
                 submitBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">autorenew</span><span class="ml-2">Preparing your table...</span>';
                 submitBtn.disabled = true;
                 
                 setTimeout(() => {
                     submitBtn.innerHTML = originalContent;
                     submitBtn.disabled = false;
                     // In a real app, redirect here
                     alert('Registration successful simulation');
                 }, 2000);
            } else {
                form.reportValidity();
            }
        });
    });
</script></main></body></html>
